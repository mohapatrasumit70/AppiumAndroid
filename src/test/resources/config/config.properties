# ──────────────────────────────────────────────────────────────
# Framework Configuration
# Edit these values for EACH project / device / environment
# ──────────────────────────────────────────────────────────────

# Appium Server
appium.server.url=http://127.0.0.1:4723

# Device
platform.version=15
device.name=Redmi 12
udid=297f55a87d7c
automation.name=UiAutomator2
auto.grant.permissions = true
no.reset = false

# App — set app.path to install APK, or leave blank to launch installed app
#app.path= src/test/resources/apk/Samaprk_2.8.4.apk  if app path null it will not install apk

app.package=com.fsfb.rmapp.fsfb_rmapp2.au
app.activity=com.fsfb.rmapp.fsfb_rmapp2.au.MainActivity

# Waits (seconds)
implicit.wait=10
explicit.wait=20

# Behaviour
screenshot.on.failure=true

# Report
report.title=Android Automation Report
report.name=Test Execution Report
environment=QA
tester.name=Automation Team


# Toggle automatic Appium server: true = auto start, false = manual start
auto.start.appium=false
appium.host=127.0.0.1
appium.port=4723
appium.server.url=http://127.0.0.1:4723

# Leave app.path empty (or comment it out) to launch the installed Sampark app on your Redmi 12
app.path=

db.url=jdbc:mysql://localhost:3306/your_database_name
db.username=your_db_username
db.password=your_db_password


# Enable or disable screen recording
record.video=true

# true = Save video ONLY when test fails | false = Save video for ALL tests (Pass & Fail)
video.on.failure.only=true
